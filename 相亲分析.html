<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>相亲对话分析</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f5;color:#333;min-height:100vh}
.top{background:#fff;padding:16px 20px;text-align:center;border-bottom:1px solid #eee}
.top h1{font-size:18px;font-weight:600}
.top p{font-size:13px;color:#999;margin-top:4px}
.main{padding:16px;max-width:640px;margin:0 auto}
.box{background:#fff;border-radius:10px;padding:16px;margin-bottom:16px}
.box label{font-size:14px;font-weight:600;color:#555;display:block;margin-bottom:10px}
textarea{width:100%;min-height:180px;padding:12px;font-size:15px;border:1px solid #ddd;border-radius:8px;line-height:1.6;font-family:inherit;resize:vertical}
textarea:focus{outline:none;border-color:#e8636b}
button{width:100%;padding:14px;font-size:16px;font-weight:600;background:#e8636b;color:#fff;border:none;border-radius:10px;cursor:pointer}
button:active{opacity:.85}
button:disabled{background:#ccc}
.out{background:#fff;border-radius:10px;padding:16px;line-height:1.8;font-size:15px;white-space:pre-wrap;word-break:break-word;margin-bottom:16px}
.out:empty{display:none}
.out b{color:#e8636b}
.load{text-align:center;padding:24px;color:#999}
.err{background:#fff3f3;color:#c0392b;padding:12px;border-radius:8px;font-size:14px}
.hint{font-size:13px;color:#aaa;margin-top:8px}
.foot{font-size:11px;color:#bbb;text-align:center;padding:20px}
</style>
</head>
<body>
<div class="top"><h1>相亲对话分析</h1><p>每条判断有出处 不灌鸡汤</p></div>
<div class="main">
<div class="box">
<label>把对话粘贴进来</label>
<textarea id="input" placeholder="把微信聊天记录复制粘贴到这里..."></textarea>
<div class="hint">数据直接发到 DeepSeek，不经过中间服务器</div>
</div>
<button id="btn" onclick="run()">开始分析</button>
<div id="out"></div>
</div>
<div class="foot">分析基于学术研究 AI生成仅供参考</div>
<script>
var KEY = "sk-b3f3116783ea47a68d4985cd1b243fc2";

async function run(){
var t=document.getElementById("input").value.trim();
var b=document.getElementById("btn");
var o=document.getElementById("out");
if(!KEY||KEY.indexOf("sk-")!==0){o.innerHTML='<div class="err">请先设置 DeepSeek API Key（打开文件编辑第58行）</div>';return}
if(t.length<10){o.innerHTML='<div class="err">对话太短</div>';return}
b.disabled=true;b.textContent="分析中...";o.innerHTML='<div class="load">正在分析...</div>';
try{
var r=await fetch("https://api.deepseek.com/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+KEY},body:JSON.stringify({model:"deepseek-chat",max_tokens:2048,temperature:0.7,messages:[{role:"system",content:"你是相亲策略顾问，基于心理学研究提供分析。每条判断必须带出处标签：[学术]来自已发表研究、[数据]来自调查统计、[推理]基于逻辑推断须写推理链条。没有出处不下判断，结尾写可信度总结。分析框架：逐句拆解→整体判断→回复建议→止损判断。知识库：Knapp关系阶段、社会渗透理论、Gottman情感竞标、相互依赖理论、《亲密关系》。回复像人话，短句。"},{role:"user",content:"分析这段相亲对话：\n\n"+t+"\n\n输出：逐句拆解→整体判断→回复建议→止损判断。每条带出处标签。"}]})});
var d=await r.json();
if(d.error){o.innerHTML='<div class="err">'+d.error.message+'</div>'}
else{var h=d.choices[0].message.content.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");o.innerHTML='<div class="out">'+h+'</div>'}
}catch(e){o.innerHTML='<div class="err">网络错误，稍后重试</div>'}
b.disabled=false;b.textContent="开始分析"}
</script>
</body>
</html>
